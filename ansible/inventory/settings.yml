# ---- Settings used by all playbooks ----

# Where the central monitoring resources live
central_subscription_id: "00000000-0000-0000-0000-000000000000"
central_resource_group: rg-disk-monitoring
workspace_name: law-disk-monitoring

# Output of scripts/bootstrap.sh
dcr_id: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-disk-monitoring/providers/Microsoft.Insights/dataCollectionRules/dcr-disk-monitoring-linux"

# Used by the quick df report
warning_threshold: 80

# Azure Resource Graph queries (one query covers ALL subscriptions the identity can read)
vms_per_subscription_query: >-
  resources
  | where type =~ 'microsoft.compute/virtualmachines'
  | summarize vms = count() by subscriptionId

running_linux_vms_query: >-
  resources
  | where type =~ 'microsoft.compute/virtualmachines'
  | where properties.storageProfile.osDisk.osType =~ 'Linux'
  | where properties.extended.instanceView.powerState.code =~ 'PowerState/running'
  | project id, name, subscriptionId, resourceGroup, location

missing_agent_query: >-
  resources
  | where type =~ 'microsoft.compute/virtualmachines'
  | where properties.storageProfile.osDisk.osType =~ 'Linux'
  | where properties.extended.instanceView.powerState.code =~ 'PowerState/running'
  | extend vmKey = tolower(id)
  | join kind=leftouter (
      resources
      | where type =~ 'microsoft.compute/virtualmachines/extensions'
      | where name =~ 'AzureMonitorLinuxAgent'
      | extend vmKey = tolower(substring(id, 0, indexof(id, '/extensions/')))
      | project vmKey, agentName = name
    ) on vmKey
  | where isempty(agentName)
  | project id, name, subscriptionId, resourceGroup, location

top_disks_query: >-
  Perf
  | where TimeGenerated > ago(30m)
  | where ObjectName == 'Logical Disk' and CounterName == '% Used Space'
  | where InstanceName != '_Total'
  | summarize UsedPct = round(max(CounterValue), 1) by Computer, InstanceName
  | top 20 by UsedPct desc
